<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간호정보학 퀴즈 (9·10·11·13주차)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
#app{max-width:760px;margin:0 auto}
.header{text-align:center;padding:28px 0 18px}
.header h1{font-size:1.55rem;font-weight:700;color:#f1f5f9;letter-spacing:-.5px}
.header p{color:#94a3b8;font-size:.85rem;margin-top:6px}
.progress-bar{background:#1e293b;border-radius:99px;height:8px;overflow:hidden;margin:14px 0 6px}
.progress-fill{height:100%;border-radius:99px;transition:width .4s;background:linear-gradient(90deg,#0ea5e9,#6366f1)}
.progress-meta{display:flex;justify-content:space-between;font-size:.78rem;color:#64748b}
.diff-row{display:flex;gap:10px;align-items:center;margin:16px 0 10px;flex-wrap:wrap}
.diff-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;font-size:.78rem;font-weight:700;letter-spacing:.3px}
.diff-1{background:#1e3a2e;color:#4ade80;border:1px solid #166534}
.diff-2{background:#1e2f4a;color:#60a5fa;border:1px solid #1d4ed8}
.diff-3{background:#3a1e2e;color:#f472b6;border:1px solid #9d174d}
.streak-badge{padding:5px 14px;border-radius:99px;font-size:.78rem;background:#1e293b;color:#fbbf24;border:1px solid #78350f}
.week-badge{padding:5px 14px;border-radius:99px;font-size:.78rem;background:#1e293b;color:#94a3b8;border:1px solid #334155}
.type-badge{padding:5px 14px;border-radius:99px;font-size:.78rem;background:#0e2a3a;color:#38bdf8;border:1px solid #0369a1}
.card{background:#1e293b;border-radius:16px;padding:28px 28px 24px;margin-bottom:16px;border:1px solid #334155}
.q-num{font-size:.78rem;color:#64748b;margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.q-text{font-size:1.05rem;line-height:1.7;color:#f1f5f9;font-weight:500}
.options{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-radius:10px;border:1.5px solid #334155;cursor:pointer;transition:all .18s;background:#0f172a}
.option:hover{border-color:#0ea5e9;background:#0e1e2e}
.option.selected{border-color:#0ea5e9;background:#0e1e2e}
.option.correct{border-color:#22c55e!important;background:#0d2a1a!important}
.option.wrong{border-color:#ef4444!important;background:#2a0d0d!important}
.option input{accent-color:#0ea5e9;margin-top:2px;flex-shrink:0;width:17px;height:17px}
.option-text{font-size:.95rem;line-height:1.5;color:#cbd5e1}
.short-input{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:10px;padding:13px 16px;color:#f1f5f9;font-size:.95rem;margin-top:18px;outline:none;transition:border-color .2s;font-family:inherit}
.short-input:focus{border-color:#0ea5e9}
.short-input.correct-input{border-color:#22c55e!important}
.short-input.wrong-input{border-color:#ef4444!important}
.btn{padding:12px 28px;border-radius:10px;border:none;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;transform:none;cursor:not-allowed}
.btn-next{background:#1e293b;color:#e2e8f0;border:1.5px solid #475569}
.btn-next:hover{border-color:#0ea5e9;color:#bae6fd}
.btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.feedback{padding:16px 18px;border-radius:10px;margin-top:16px;line-height:1.6;font-size:.9rem}
.feedback.correct-fb{background:#0d2a1a;border:1px solid #166534;color:#86efac}
.feedback.wrong-fb{background:#2a0d0d;border:1px solid #991b1b;color:#fca5a5}
.feedback-title{font-weight:700;font-size:1rem;margin-bottom:6px}
.feedback-exp{color:#cbd5e1;margin-top:8px;font-size:.88rem;line-height:1.65}
.result{text-align:center;padding:40px 20px}
.result-score{font-size:3.5rem;font-weight:800;background:linear-gradient(135deg,#0ea5e9,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:18px 0 8px}
.result-label{font-size:1rem;color:#94a3b8;margin-bottom:24px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.result-cell{background:#1e293b;border-radius:12px;padding:18px 10px;border:1px solid #334155}
.result-cell-n{font-size:1.8rem;font-weight:700;color:#f1f5f9}
.result-cell-l{font-size:.78rem;color:#64748b;margin-top:4px}
.result-msg{font-size:1.1rem;color:#e2e8f0;margin:10px 0 24px;line-height:1.6}
.diff-summary{display:flex;flex-direction:column;gap:8px;margin:16px 0 28px;text-align:left}
.diff-summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;border-radius:8px;font-size:.88rem}
.btn-restart{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;padding:14px 36px;border-radius:12px;border:none;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s}
.btn-restart:hover{opacity:.88}
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px}
.mode-tab{background:#1e293b;border:2px solid #334155;border-radius:14px;padding:18px 16px;cursor:pointer;font-family:inherit;text-align:center;transition:all .2s;width:100%}
.mode-tab:hover{border-color:#0ea5e9}
.mode-tab.active{border-color:#0ea5e9;background:#0e1e2e}
.mode-tab-title{font-size:1rem;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.mode-tab-sub{font-size:.78rem;color:#64748b}
.mode-tab.active .mode-tab-sub{color:#94a3b8}
.start{text-align:center;padding:50px 20px}
.start h2{font-size:1.5rem;font-weight:700;color:#f1f5f9;margin-bottom:12px}
.start p{color:#94a3b8;font-size:.92rem;line-height:1.7;margin-bottom:10px}
.start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.start-cell{background:#1e293b;border-radius:12px;padding:18px 10px;border:1px solid #334155}
.start-cell-n{font-size:1.6rem;font-weight:700}
.start-cell-l{font-size:.78rem;color:#64748b;margin-top:6px}
.n-green{color:#4ade80}.n-blue{color:#60a5fa}.n-pink{color:#f472b6}
.algo-box{background:#1e293b;border-radius:12px;padding:18px 20px;text-align:left;margin:0 0 28px;border:1px solid #334155;font-size:.85rem;line-height:1.75;color:#94a3b8}
.algo-box strong{color:#bae6fd}
@media(max-width:480px){
  .card{padding:20px 16px}
  .diff-row{gap:6px}
  .diff-badge,.streak-badge,.week-badge,.type-badge{padding:4px 10px;font-size:.72rem}
}
.btn-back{display:inline-flex;align-items:center;gap:5px;background:transparent;color:#64748b;border:1.5px solid #334155;padding:7px 16px;border-radius:8px;font-size:.82rem;cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none}
.btn-back:hover{border-color:#0ea5e9;color:#bae6fd}
.back-row{margin-bottom:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const QUESTIONS = [
// ══ 9주차 — 디지털 헬스 ══
{id:1,week:9,topic:'디지털 헬스',diff:1,type:'single',
q:'디지털 헬스(Digital Health)의 정의로 가장 적절한 것은?',
opts:['의사가 환자에게 비대면으로 진료만 제공하는 서비스','ICT(정보통신기술)와 헬스케어를 결합하여 환자·일반인의 건강증진을 목표로 하는 분야','병원 내부의 전자의무기록(EMR) 시스템을 관리하는 학문','의료기기를 제조하는 바이오메디컬 산업'],
ans:[1],
exp:'디지털 헬스 = ICT(빅데이터·AI 포함) + 헬스케어. 정교한 맞춤형 의료서비스 제공, 환자·일반인의 건강증진을 목표로 하는 제품 및 서비스 개발 분야 (산업통상자원부, 2019). 범위: 생체데이터 수집 → 바이오 빅데이터 플랫폼 → AI 기반 혁신의료 → 스마트 건강관리.'},

{id:2,week:9,topic:'디지털 헬스',diff:1,type:'single',
q:'eHealth와 mHealth를 올바르게 비교한 것은?',
opts:['eHealth = 모바일 기기 기반, mHealth = 인터넷 기반','eHealth = 인터넷·관련 기술 기반 헬스케어, mHealth = 모바일 기기 기반 헬스케어','eHealth = 원격 수술 시스템, mHealth = 전자처방전 발급','eHealth = 의료 빅데이터, mHealth = 의료 AI 분석'],
ans:[1],
exp:'eHealth = 인터넷과 관련 기술을 이용하여 제공되는 헬스케어 서비스. mHealth = 모바일 전화, 환자 모니터링 기기, PDA 등 모바일 기기 기반 헬스케어 서비스 (WHO, 2011).'},

{id:3,week:9,topic:'디지털 헬스',diff:2,type:'single',
q:'디지털 치료기기(DTx)가 일반 건강관리 앱과 구별되는 핵심 특징은?',
opts:['스마트폰에서 실행된다','임상적으로 효과·안전성이 입증된 소프트웨어를 기반으로 한다','무료로 배포된다','게임이나 VR 기술을 반드시 활용한다'],
ans:[1],
exp:'DTx = 임상적으로 효과·안전성이 입증된 소프트웨어 기반으로 질병을 예방·관리·치료. 의료기기(SaMD)로 분류되어 임상 근거 검증 및 규제 대상. 단순 건강관리 앱과의 핵심 차이점.'},

{id:4,week:9,topic:'디지털 헬스',diff:1,type:'short',
q:'DTx(디지털 치료기기)는 어떤 기기 유형으로 분류되는가? 영어 약자(4글자)로 쓰시오.',
keys:['SaMD','samd','s a m d'],
exp:'SaMD(Software as a Medical Device) = 특정 하드웨어에 의존하지 않는 독립적 소프트웨어 의료기술. DTx는 SaMD로 분류되어 임상 근거 검증이 요구됩니다.'},

{id:5,week:9,topic:'디지털 헬스',diff:2,type:'single',
q:'보건소 모바일 헬스케어 사업에 대한 설명으로 옳은 것은?',
opts:['2020년 코로나19 대응 목적으로 시작된 사업이다','2017년부터 시작된 24주 스마트기기 활용 만성질환 관리 사업이다','전국 20개 병원에서 시행되는 입원환자 관리 프로그램이다','AI 기반 원격 진단 서비스를 무상 제공하는 국가 사업이다'],
ans:[1],
exp:'보건소 모바일 헬스케어 사업(2017년~): 24주 스마트기기 활용 만성질환 관리. 2023년 기준 202개 보건소, 28,000명 대상으로 운영.'},

{id:6,week:9,topic:'디지털 헬스',diff:2,type:'single',
q:'디지털 헬스의 도전 과제와 그 내용의 연결이 옳지 않은 것은?',
opts:['데이터 보안 — 랜섬웨어·피싱 등 사이버 공격, 암호화·보안 프로토콜 필수','접근성 — 고령층, 디지털 기기 미숙자, 저소득층의 이용 제한','정보 신뢰성 — 잘못된 정보의 빠른 확산, 건강정보 평가 체계 필요','비용 효율성 — DTx 치료비용이 기존 약물요법보다 항상 낮은 문제'],
ans:[3],
exp:'디지털 헬스의 3대 도전 과제: ①데이터 보안(사이버 공격·암호화) ②접근성(디지털 격차·고령층 등) ③정보 신뢰성(오정보 확산, 예: 유튜브 통풍 콘텐츠의 20%가 잘못된 정보). 비용 효율성은 교재에 명시된 도전 과제가 아닙니다.'},

{id:7,week:9,topic:'디지털 헬스',diff:2,type:'short',
q:'디지털 헬스에서 언급되는 E-patient란 어떤 환자를 의미하는가? 핵심 특징을 한 문장으로 쓰시오.',
keys:['건강 데이터','치료 결정','적극','능동','참여'],
exp:'E-patient = 건강 데이터를 분석하고 치료 결정에 적극 참여하는 능동적 환자. 환자 참여·공유의사결정의 기술적 토대이며, 디지털 헬스의 장점 중 하나로 꼽힙니다.'},

{id:8,week:9,topic:'디지털 헬스',diff:3,type:'single',
q:'디지털 헬스와 간호의 관계에서 문제점-방향의 연결이 옳지 않은 것은?',
opts:['기술 복잡성 → 사람 중심 통합적 건강관리 체계 지원 방향으로','환자와의 상호작용 감소 → 안전성·윤리성·보안성·신뢰성 기반 개발 방향으로','많은 디지털 기술이 간호 관점 없이 설계 → 정책결정·기술개발·설계에 간호사 참여 필수','데이터 표준화 부족 → 간호사는 임상 업무에만 집중하고 표준화는 IT 전문가에게 맡기는 방향으로'],
ans:[3],
exp:'교재 내용: 데이터 표준화 부족 → 간호용어 표준화(ICNP 등)로 해결. 간호사는 데이터 표준화 과정에도 참여해야 합니다. "IT 전문가에게 맡기는 방향"은 교재의 방향성과 반대입니다.'},

{id:9,week:9,topic:'디지털 헬스',diff:1,type:'single',
q:'헬스 애플리케이션의 유형 분류로 옳은 것은?',
opts:['처방전 앱과 진단 앱','건강생활관리 앱과 질병관리 앱','병원 예약 앱과 원격 수술 앱','EHR 앱과 PHR 앱'],
ans:[1],
exp:'헬스 앱 유형: ①건강생활관리 앱(운동 추적, 식단 관리, 명상·정신 건강 지원) ②질병관리 앱(질병 정보, 투약 알림, 만성질환 맞춤 관리). 2021년 기준 35만 개 이상 앱이 시장에 존재.'},

{id:10,week:9,topic:'디지털 헬스',diff:2,type:'single',
q:'환자포털(Patient Portal)의 기능으로 옳지 않은 것은?',
opts:['진료 기록 및 검사 결과 확인','처방약 정보 확인 및 진료 예약 조정','OpenNotes와 같은 임상기록 공유의 기술적 구현','의료진이 처방을 자동 생성하고 승인 없이 발급하는 AI 시스템'],
ans:[3],
exp:'환자포털 = 환자가 자신의 의료 정보를 온라인으로 접근·관리할 수 있는 디지털 플랫폼. 진료 기록, 검사 결과, 처방약 정보 확인, 진료 예약 조정, OpenNotes 기술적 구현. 의료진 처방 자동 발급은 환자포털이 아닌 CDSS/EMR 기능입니다.'},

{id:11,week:9,topic:'디지털 헬스',diff:2,type:'short',
q:'PHR과 PGHR 데이터를 환자가 직접 수집·관리하는 서비스 확대가 mHealth 발전의 배경으로 꼽히는 이유는?',
keys:['환자 참여','직접 수집','관리','기술적 기반'],
exp:'PHR·PGHR 데이터를 환자가 직접 수집·관리하는 서비스 확대는 환자 참여 확대의 기술적 기반이 됩니다. 스마트폰·웨어러블 기기 상용화가 이를 가능하게 했습니다.'},

{id:12,week:9,topic:'디지털 헬스',diff:3,type:'single',
q:'간호에서 디지털 헬스 활용이 필요한 이유를 가장 잘 설명한 것은?',
opts:['간호사의 업무를 자동화하여 인력을 감축하기 위해','의료 데이터 기록·관리 자동화, 근거 기반 실무 실천, 환자 건강증진 도구로 활용하기 위해','의료 결정을 AI가 대신하도록 하여 의료진의 책임을 줄이기 위해','환자와의 대면 접촉을 최소화하여 감염 위험을 줄이기 위해'],
ans:[1],
exp:'간호에서 디지털 헬스의 역할: ①의료 데이터 기록·관리·전송 자동화 ②데이터 시각화 → 근거 기반 실무 실천 ③생체 정보 원격 모니터링 및 임상의사결정 지원 ④환자 건강증진 도구. 수집된 데이터는 PBE의 원천 자료가 됩니다.'},

// ══ 9주차 — 소비자건강정보학 ══

// ─── QUIZ STATE ───────────────────────────────────────────────────────────────
let state = {
  started: false,
  finished: false,
  current: null,
  difficulty: 1,
  answered: false,
  streakCorrect: 0,
  streakWrong: 0,
  used: new Set(),
  totalAnswered: 0,
  totalCorrect: 0,
  diffStats: {1:{correct:0,total:0},2:{correct:0,total:0},3:{correct:0,total:0}},
  selectedOpts: new Set(),
  shortVal: '',
  wrongQuestions: [],
  shuffleMap: null,
  mode: 'adaptive',
};
const TOTAL_ADAPTIVE = 40;

function getTotal(){ return state.mode === 'full' ? QUESTIONS.length : TOTAL_ADAPTIVE; }
const STREAK_UP = 3;
const STREAK_DOWN = 2;

function diffLabel(d){return d===1?'기본':d===2?'중급':'고급'}
function diffClass(d){return d===1?'diff-1':d===2?'diff-2':'diff-3'}
function typeLabel(t){return t==='single'?'단일정답':'주관식'}
function weekLabel(w){return w===9?'9주차':w===10?'10주차':w===11?'11주차':'13주차'}

function shuffleArr(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function getPool(diff){
  return QUESTIONS.filter(q=>q.diff===diff && !state.used.has(q.id));
}

function pickQuestion(){
  if(state.mode==='full'){
    const left=QUESTIONS.filter(q=>!state.used.has(q.id));
    if(left.length===0) return null;
    return left[Math.floor(Math.random()*left.length)];
  }
  let pool=getPool(state.difficulty);
  if(pool.length===0){
    const allLeft=QUESTIONS.filter(q=>!state.used.has(q.id));
    if(allLeft.length===0) return null;
    const diffs=[state.difficulty===1?2:state.difficulty-1,state.difficulty===3?2:state.difficulty+1,1,2,3];
    for(const d of diffs){
      pool=allLeft.filter(q=>q.diff===d);
      if(pool.length>0) break;
    }
  }
  if(pool.length===0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function checkAnswer(){
  const q=state.current;
  if(q.type==='short'){
    const val=state.shortVal.trim().toLowerCase();
    return q.keys.some(k=>val.includes(k.toLowerCase()));
  }
  const selOrig=[...state.selectedOpts].map(di=>state.shuffleMap[di]).sort((a,b)=>a-b);
  const ans=[...q.ans].sort((a,b)=>a-b);
  return selOrig.length===ans.length&&selOrig.every((v,i)=>v===ans[i]);
}

function nextQuestion(){
  const q=pickQuestion();
  if(!q||state.totalAnswered>=getTotal()){
    state.finished=true;
    render();
    return;
  }
  state.current=q;
  state.used.add(q.id);
  state.answered=false;
  state.selectedOpts=new Set();
  state.shortVal='';
  if(q.type==='single'){
    const idxs=shuffleArr([...Array(q.opts.length).keys()]);
    state.shuffleMap=idxs;
  }
  render();
}

function submitAnswer(){
  if(state.answered) return;
  const q=state.current;
  if(q.type==='short'&&!state.shortVal.trim()) return;
  if(q.type==='single'&&state.selectedOpts.size===0) return;
  state.answered=true;
  const correct=checkAnswer();
  state.totalAnswered++;
  state.diffStats[q.diff].total++;
  if(correct){
    state.totalCorrect++;
    state.diffStats[q.diff].correct++;
    state.streakCorrect++;
    state.streakWrong=0;
    if(state.streakCorrect>=STREAK_UP&&state.difficulty<3){
      state.difficulty++;
      state.streakCorrect=0;
    }
  } else {
    state.wrongQuestions.push(q.id);
    state.streakWrong++;
    state.streakCorrect=0;
    if(state.streakWrong>=STREAK_DOWN&&state.difficulty>1){
      state.difficulty--;
      state.streakWrong=0;
    }
  }
  render();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById('app');
  if(!state.started){app.innerHTML=renderStart();return;}
  if(state.finished){app.innerHTML=renderResult();return;}
  app.innerHTML=renderQuestion();
  bindEvents();
}

  return `

        <div class="start-cell"><div class="start-cell-n n-blue">${q2}</div><div class="start-cell-l">중급 문제</div></div>
        <div class="start-cell"><div class="start-cell-n n-pink">${q3}</div><div class="start-cell-l">고급 문제</div></div>
      </div>
      <div class="algo-box">

        13주차 — 간호정보학 연구와 데이터
      </div>
      <a href="menu.html" class="btn-back" style="margin-bottom:20px">← 메뉴로</a>
      <br><br>
      <button class="btn btn-primary" onclick="startQuiz()" style="padding:14px 44px;font-size:1.05rem">시작하기</button>
    </div>
  </div>`;
}

function renderQuestion(){
  const q=state.current;
  const progress=state.totalAnswered/getTotal();
  const streakStr=state.streakCorrect>0?`🔥 ${state.streakCorrect}연속`:(state.streakWrong>0?`❌ ${state.streakWrong}연속`:'');
  let optsHtml='';
  if(q.type==='single'){
    const shuffled=state.shuffleMap.map(i=>({text:q.opts[i],origIdx:i,dispIdx:state.shuffleMap.indexOf(i)}));
    optsHtml=`<div class="options">`;
    state.shuffleMap.forEach((origIdx,dispIdx)=>{
      let cls='option';
      if(state.answered){
        if(q.ans.includes(origIdx)){cls+=' correct';}
        else if(state.selectedOpts.has(dispIdx)){cls+=' wrong';}
      } else if(state.selectedOpts.has(dispIdx)){cls+=' selected';}
      optsHtml+=`<label class="${cls}" data-disp="${dispIdx}"><input type="radio" name="opt" ${state.answered?'disabled':''} ${state.selectedOpts.has(dispIdx)?'checked':''}><span class="option-text">${q.opts[origIdx]}</span></label>`;
    });
    optsHtml+=`</div>`;
  } else {
    const inputCls=state.answered?(checkAnswer()?'correct-input':'wrong-input'):'';
    optsHtml=`<textarea class="short-input ${inputCls}" rows="3" placeholder="여기에 답을 입력하세요..." ${state.answered?'disabled':''}>${state.shortVal}</textarea>`;
  }
  let feedbackHtml='';
  if(state.answered){
    const ok=checkAnswer();
    feedbackHtml=`<div class="feedback ${ok?'correct-fb':'wrong-fb'}">
      <div class="feedback-title">${ok?'✓ 정답입니다!':'✗ 오답입니다'}</div>
      <div class="feedback-exp">${q.exp}</div>
    </div>`;
  }
  return `
  <div class="back-row"><a href="menu.html" class="btn-back">← 메뉴</a></div>
  <div class="header">
    <h1>간호정보학 퀴즈</h1>
    <p>${weekLabel(q.week)} · ${q.topic}</p>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(progress*100)}%"></div></div>
  <div class="progress-meta">
    <span>${state.totalAnswered} / ${getTotal()} 문제</span>
    <span>${Math.round(state.totalAnswered>0?state.totalCorrect/state.totalAnswered*100:0)}% 정답</span>
  </div>
  <div class="diff-row">
    <span class="diff-badge ${diffClass(q.diff)}">${diffLabel(q.diff)}</span>
    <span class="week-badge">${weekLabel(q.week)}</span>
    <span class="type-badge">${typeLabel(q.type)}</span>
    ${streakStr?`<span class="streak-badge">${streakStr}</span>`:''}
  </div>
  <div class="card">
    <div class="q-num">문제 ${state.totalAnswered+1} of ${getTotal()}</div>
    <div class="q-text">${q.q}</div>
    ${optsHtml}
    ${feedbackHtml}
    <div class="btn-row">
      ${!state.answered?`<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">제출</button>`:''}
      ${state.answered?`<button class="btn btn-next" onclick="advance()">다음 문제 →</button>`:''}
    </div>
  </div>`;
}

function renderResult(){
  const pct=Math.round(state.totalCorrect/state.totalAnswered*100);
  const msg=pct>=90?'완벽에 가깝습니다! 시험 자신있게 보세요 💪':
            pct>=75?'잘 했어요! 틀린 부분 한 번 더 복습하면 완벽.':
            pct>=60?'절반 이상 맞았어요. 취약 주제 집중 복습이 필요합니다.':
            '기초부터 다시 한 번 정리해 봐요. 차근차근 할 수 있어요!';
  const d1=state.diffStats[1],d2=state.diffStats[2],d3=state.diffStats[3];
  return `
  <div class="back-row"><a href="menu.html" class="btn-back">← 메뉴</a></div>
  <div class="header"><h1>간호정보학 퀴즈</h1><p>결과 요약</p></div>
  <div class="card">
    <div class="result">
      <div class="result-score">${pct}%</div>
      <div class="result-label">${state.totalCorrect} / ${state.totalAnswered} 정답</div>
      <div class="result-msg">${msg}</div>
      <div class="result-grid">
        <div class="result-cell"><div class="result-cell-n n-green">${d1.total>0?Math.round(d1.correct/d1.total*100):'-'}%</div><div class="result-cell-l">기본 (${d1.correct}/${d1.total})</div></div>
        <div class="result-cell"><div class="result-cell-n n-blue">${d2.total>0?Math.round(d2.correct/d2.total*100):'-'}%</div><div class="result-cell-l">중급 (${d2.correct}/${d2.total})</div></div>
        <div class="result-cell"><div class="result-cell-n n-pink">${d3.total>0?Math.round(d3.correct/d3.total*100):'-'}%</div><div class="result-cell-l">고급 (${d3.correct}/${d3.total})</div></div>
      </div>
      <div class="diff-summary">
        ${d1.total>0?`<div class="diff-summary-row"><span class="diff-badge diff-1">기본</span><span>${d1.correct}/${d1.total}문제 · ${Math.round(d1.correct/d1.total*100)}%</span></div>`:''}
        ${d2.total>0?`<div class="diff-summary-row"><span class="diff-badge diff-2">중급</span><span>${d2.correct}/${d2.total}문제 · ${Math.round(d2.correct/d2.total*100)}%</span></div>`:''}
        ${d3.total>0?`<div class="diff-summary-row"><span class="diff-badge diff-3">고급</span><span>${d3.correct}/${d3.total}문제 · ${Math.round(d3.correct/d3.total*100)}%</span></div>`:''}
      </div>
      <button class="btn-restart" onclick="restartQuiz()">다시 풀기</button>
    </div>
  </div>`;
}

// ─── EVENT BINDING ────────────────────────────────────────────────────────────
function bindEvents(){
  const q=state.current;
  if(q&&q.type==='single'&&!state.answered){
    document.querySelectorAll('.option').forEach(el=>{
      el.addEventListener('click',()=>{
        if(state.answered) return;
        const disp=parseInt(el.dataset.disp);
        state.selectedOpts=new Set([disp]);
        render();
        bindEvents();
      });
    });
  }
  if(q&&q.type==='short'&&!state.answered){
    const ta=document.querySelector('.short-input');
    if(ta){
      ta.value=state.shortVal;
      ta.addEventListener('input',e=>{state.shortVal=e.target.value;});
      ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitAnswer();}});
      ta.focus();
    }
  }
  const sb=document.getElementById('submitBtn');
  if(sb){
    const disable=()=>{
      if(q.type==='single'&&state.selectedOpts.size===0) sb.disabled=true;
      else if(q.type==='short'&&!state.shortVal.trim()) sb.disabled=true;
      else sb.disabled=false;
    };
    disable();
    if(q.type==='short'){
      const ta=document.querySelector('.short-input');
      if(ta) ta.addEventListener('input',()=>{sb.disabled=!ta.value.trim();});
    }
  }
}

// ─── GLOBAL FUNCTIONS ─────────────────────────────────────────────────────────
function setMode(m){state.mode=m;render();}
function startQuiz(){state.started=true;nextQuestion();}
function advance(){
  if(state.totalAnswered>=getTotal()){state.finished=true;render();return;}
  nextQuestion();
}
function restartQuiz(){
  state={started:false,finished:false,current:null,difficulty:1,answered:false,
    streakCorrect:0,streakWrong:0,used:new Set(),totalAnswered:0,totalCorrect:0,
    diffStats:{1:{correct:0,total:0},2:{correct:0,total:0},3:{correct:0,total:0}},
    selectedOpts:new Set(),shortVal:'',wrongQuestions:[],shuffleMap:null,mode:state.mode};
  render();
}

render();
</script>
