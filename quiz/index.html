<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기본간호학1 적응형 퀴즈 (8~15주차)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
#app{max-width:760px;margin:0 auto}

/* Header */
.header{text-align:center;padding:28px 0 18px}
.header h1{font-size:1.55rem;font-weight:700;color:#f1f5f9;letter-spacing:-.5px}
.header p{color:#94a3b8;font-size:.85rem;margin-top:6px}

/* Progress */
.progress-bar{background:#1e293b;border-radius:99px;height:8px;overflow:hidden;margin:14px 0 6px}
.progress-fill{height:100%;border-radius:99px;transition:width .4s;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.progress-meta{display:flex;justify-content:space-between;font-size:.78rem;color:#64748b}

/* Difficulty badge */
.diff-row{display:flex;gap:10px;align-items:center;margin:16px 0 10px;flex-wrap:wrap}
.diff-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;font-size:.78rem;font-weight:700;letter-spacing:.3px}
.diff-1{background:#1e3a2e;color:#4ade80;border:1px solid #166534}
.diff-2{background:#1e2f4a;color:#60a5fa;border:1px solid #1d4ed8}
.diff-3{background:#3a1e2e;color:#f472b6;border:1px solid #9d174d}
.streak-badge{padding:5px 14px;border-radius:99px;font-size:.78rem;background:#1e293b;color:#fbbf24;border:1px solid #78350f}
.week-badge{padding:5px 14px;border-radius:99px;font-size:.78rem;background:#1e293b;color:#94a3b8;border:1px solid #334155}
.type-badge{padding:5px 14px;border-radius:99px;font-size:.78rem;background:#2e1e3a;color:#c084fc;border:1px solid #6d28d9}

/* Card */
.card{background:#1e293b;border-radius:16px;padding:28px 28px 24px;margin-bottom:16px;border:1px solid #334155}
.q-num{font-size:.78rem;color:#64748b;margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.q-text{font-size:1.05rem;line-height:1.7;color:#f1f5f9;font-weight:500}
.q-hint{font-size:.8rem;color:#6366f1;margin-top:8px;font-style:italic}

/* Options */
.options{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-radius:10px;border:1.5px solid #334155;cursor:pointer;transition:all .18s;background:#0f172a}
.option:hover{border-color:#6366f1;background:#1e1e3a}
.option.selected{border-color:#6366f1;background:#1e1e3a}
.option.correct{border-color:#22c55e!important;background:#0d2a1a!important}
.option.wrong{border-color:#ef4444!important;background:#2a0d0d!important}
.option.highlight{border-color:#22c55e!important;background:#0d2a1a!important}
.option input{accent-color:#6366f1;margin-top:2px;flex-shrink:0;width:17px;height:17px}
.option-text{font-size:.95rem;line-height:1.5;color:#cbd5e1}

/* Short answer */
.short-input{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:10px;padding:13px 16px;color:#f1f5f9;font-size:.95rem;margin-top:18px;outline:none;transition:border-color .2s;font-family:inherit}
.short-input:focus{border-color:#6366f1}
.short-input.correct-input{border-color:#22c55e!important}
.short-input.wrong-input{border-color:#ef4444!important}

/* Buttons */
.btn{padding:12px 28px;border-radius:10px;border:none;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .18s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;transform:none;cursor:not-allowed}
.btn-next{background:#1e293b;color:#e2e8f0;border:1.5px solid #475569}
.btn-next:hover{border-color:#6366f1;color:#c7d2fe}
.btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}

/* Feedback */
.feedback{padding:16px 18px;border-radius:10px;margin-top:16px;line-height:1.6;font-size:.9rem}
.feedback.correct-fb{background:#0d2a1a;border:1px solid #166534;color:#86efac}
.feedback.wrong-fb{background:#2a0d0d;border:1px solid #991b1b;color:#fca5a5}
.feedback-title{font-weight:700;font-size:1rem;margin-bottom:6px}
.feedback-exp{color:#cbd5e1;margin-top:8px;font-size:.88rem;line-height:1.65}

/* Hint bar */
.hint-bar{background:#1e2a1e;border:1px solid #166534;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:.82rem;color:#86efac}

/* Result screen */
.result{text-align:center;padding:40px 20px}
.result-score{font-size:3.5rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:18px 0 8px}
.result-label{font-size:1rem;color:#94a3b8;margin-bottom:24px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.result-cell{background:#1e293b;border-radius:12px;padding:18px 10px;border:1px solid #334155}
.result-cell-n{font-size:1.8rem;font-weight:700;color:#f1f5f9}
.result-cell-l{font-size:.78rem;color:#64748b;margin-top:4px}
.result-msg{font-size:1.1rem;color:#e2e8f0;margin:10px 0 24px;line-height:1.6}
.diff-summary{display:flex;flex-direction:column;gap:8px;margin:16px 0 28px;text-align:left}
.diff-summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#1e293b;border-radius:8px;font-size:.88rem}
.btn-restart{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:14px 36px;border-radius:12px;border:none;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s}
.btn-restart:hover{opacity:.88}

/* Mode selector tabs */
.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px}
.mode-tab{background:#1e293b;border:2px solid #334155;border-radius:14px;padding:18px 16px;cursor:pointer;font-family:inherit;text-align:center;transition:all .2s;width:100%}
.mode-tab:hover{border-color:#6366f1}
.mode-tab.active{border-color:#6366f1;background:#1e1e3a}
.mode-tab-title{font-size:1rem;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.mode-tab-sub{font-size:.78rem;color:#64748b}
.mode-tab.active .mode-tab-sub{color:#94a3b8}

/* Start screen */
.start{text-align:center;padding:50px 20px}
.start h2{font-size:1.5rem;font-weight:700;color:#f1f5f9;margin-bottom:12px}
.start p{color:#94a3b8;font-size:.92rem;line-height:1.7;margin-bottom:10px}
.start-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.start-cell{background:#1e293b;border-radius:12px;padding:18px 10px;border:1px solid #334155}
.start-cell-n{font-size:1.6rem;font-weight:700}
.start-cell-l{font-size:.78rem;color:#64748b;margin-top:6px}
.n-green{color:#4ade80}.n-blue{color:#60a5fa}.n-pink{color:#f472b6}
.algo-box{background:#1e293b;border-radius:12px;padding:18px 20px;text-align:left;margin:0 0 28px;border:1px solid #334155;font-size:.85rem;line-height:1.75;color:#94a3b8}
.algo-box strong{color:#c7d2fe}

@media(max-width:480px){
  .card{padding:20px 16px}
  .result-grid{grid-template-columns:repeat(3,1fr)}
  .start-grid{grid-template-columns:repeat(3,1fr)}
  .diff-row{gap:6px}
  .diff-badge,.streak-badge,.week-badge,.type-badge{padding:4px 10px;font-size:.72rem}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─── QUESTION BANK (160 questions) ───────────────────────────────────────────
const QUESTIONS = [
// ══ 8주차 ══
{id:1,week:8,diff:1,type:'single',
q:'ADME에서 약물의 대사(Metabolism)가 주로 일어나는 기관은?',
opts:['신장','간','폐','소장','피부'],
ans:[1],
exp:'약물 대사는 주로 간(liver)에서 이루어집니다. 신장은 배설(Excretion)을 담당합니다.'},
{id:2,week:8,diff:1,type:'single',
q:'투약의 6Rights 중 해당하지 않는 것은?',
opts:['정확한 환자','정확한 약물','정확한 진단','정확한 용량','정확한 시간'],
ans:[2],
exp:'6Rights: 정확한 환자·약물·용량·경로·시간·기록. 진단은 의사의 영역으로 6Rights에 포함되지 않습니다.'},
{id:3,week:8,diff:1,type:'single',
q:'귀약 투여 시 3세 이하 영아에서 이개(귀)를 당기는 방향은?',
opts:['후상방','전상방','후하방','전하방','후방'],
ans:[2],
exp:'3세 이하: 이개를 후하방으로, 3세 이상: 후상방으로 당겨 외이도를 직선화합니다.'},
{id:4,week:8,diff:1,type:'single',
q:'투약 기록을 약물 투여 후 즉시 해야 하는 주된 이유는?',
opts:['간호사의 편의를 위해','법적인 의미가 있기 때문','의사가 요구하기 때문','약물 효과를 확인하기 위해','보험 청구를 위해'],
ans:[1],
exp:'투약 기록은 법적 의미가 있는 기록입니다. 투여 전 기록 금지, 투여 후 즉시 기록해야 합니다.'},
{id:5,week:8,diff:1,type:'single',
q:'Stat order의 정의로 옳은 것은?',
opts:['특정 시간에 한 번만 투여','중단 지시까지 계속 투여','처방 즉시 1회만 투여','필요 시 투여','식전에 투여'],
ans:[2],
exp:'Stat order = 즉시 처방. 처방 즉시 1회 투여. 주로 응급 상황에 사용합니다.'},
{id:6,week:8,diff:1,type:'single',
q:'경구 물약(액체 약)의 용량을 읽을 때 기준이 되는 것은?',
opts:['액체의 최상단 높이','액체의 평균 높이','바닥 높이(Meniscus)','눈금의 최대값','용기 중간선'],
ans:[2],
exp:'약잔을 눈높이에 위치시키고 액체의 바닥 높이(Meniscus)를 기준으로 눈금을 읽습니다.'},
{id:7,week:8,diff:1,type:'single',
q:'안약(eye drop)과 안연고(eye ointment)를 함께 투여할 때 올바른 순서는?',
opts:['안연고 먼저 → 안약','안약 먼저 → 안연고','동시에 투여','순서 무관','안약만 투여'],
ans:[1],
exp:'안약을 먼저 투여한 후 안연고를 투여합니다. 안연고가 먼저 들어가면 안약 흡수를 방해합니다.'},
{id:8,week:8,diff:1,type:'single',
q:'흡입제(Inhaler) 스테로이드 제제 사용 후 반드시 해야 하는 것은?',
opts:['코를 막기','물로 입안 헹구기','30분간 눕기','깊게 호흡하기','즉시 물 마시기'],
ans:[1],
exp:'흡입 스테로이드 사용 후 반드시 물로 입안을 헹궈야 합니다. 헹구지 않으면 구강 칸디다증이 발생할 수 있습니다.'},
{id:9,week:8,diff:2,type:'multi',
q:'다음 중 경구투약의 금기 대상자에 해당하는 것을 모두 고르시오. (복수정답)',
opts:['무의식 환자','연하곤란 환자','편마비 환자','NPO 환자','구토 환자'],
ans:[0,1,3,4],
exp:'경구투약 금기: 무의식·연하곤란·지남력상실·NPO·구강수술/외상·구토 환자. 편마비 환자는 건강한 쪽으로 삼키게 하면 경구투약 가능합니다.'},
{id:10,week:8,diff:2,type:'single',
q:'알코올과 진정제를 함께 복용했을 때 나타나는 약물 상호작용은?',
opts:['대항효과','내성','상승효과','습관화','위약효과'],
ans:[2],
exp:'알코올+진정제 → 상승효과(Synergistic effect). 두 약물을 함께 투여 시 각각의 효과보다 더 큰 효과가 나타납니다.'},
{id:11,week:8,diff:2,type:'single',
q:'PRN order(필요시 처방)의 특징으로 옳은 것은?',
opts:['처방 즉시 1회 투여','특정 시간에 한 번만 투여','중단 지시까지 계속 투여','특정 증상 발생 시 간호사 판단으로 투여','의사가 직접 투여'],
ans:[3],
exp:'PRN order = 필요시 처방. 특정 증상이나 상황 발생 시 간호사의 판단에 따라 투여합니다.'},
{id:12,week:8,diff:2,type:'multi',
q:'약물 작용에 영향을 미치는 신체적(Physical) 변수에 해당하는 것을 모두 고르시오. (복수정답)',
opts:['연령','유전적 요인','위약효과','성별','음식'],
ans:[0,1,3],
exp:'신체적 변수: 연령·성별·키·체중·유전적 요인. 위약효과=병태생리적 변수, 음식=외부적 변수입니다.'},
{id:13,week:8,diff:3,type:'multi',
q:'다음 중 약물 작용 유형과 설명이 올바르게 연결된 것을 모두 고르시오. (복수정답)',
opts:['부작용 - 치료 목적과 무관하나 예측 가능한 경미한 반응','독성 효과 - 고용량 또는 과도한 축적으로 인한 치명적 반응','알레르기 반응 - 반복 사용으로 생기는 심리적 의존','약물 내성 - 동일 효과를 위해 용량 증가가 필요한 상태','축적 효과 - 대사/배설 지연으로 체내 약물이 쌓여 효과 증폭'],
ans:[0,1,3,4],
exp:'알레르기 반응은 약물을 외부 물질로 인식하는 면역 반응으로, 심리적 의존(습관화)과 다릅니다. 나머지는 모두 올바른 설명입니다.'},
{id:14,week:8,diff:3,type:'short',
q:'구두처방(verbal order) 후 반드시 서면 처방을 받아야 하는 시간 제한을 적으시오.',
keys:['24','24시간'],
exp:'구두처방은 CPR 등 긴급상황에서만 수행하며, 24시간 이내 반드시 서면 처방을 받아야 합니다.'},

// ══ 9주차 ══
{id:15,week:9,diff:1,type:'single',
q:'비경구 투약(주사) 중 흡수 속도가 가장 빠른 것은?',
opts:['피내주사(ID)','피하주사(SC)','근육주사(IM)','정맥주사(IV)','경구투약'],
ans:[3],
exp:'흡수 속도: IV > IM > SC > ID. 정맥주사는 약물을 혈관에 직접 투여하므로 가장 빠릅니다.'},
{id:16,week:9,diff:1,type:'single',
q:'피내주사(ID, intradermal injection)의 주사 각도는?',
opts:['45°','90°','10~15°','25~30°','60~75°'],
ans:[2],
exp:'피내주사: 10~15° 각도로 진피층에 주입. 피하주사: 45~90°, 근육주사: 90°.'},
{id:17,week:9,diff:1,type:'single',
q:'Z-Track 기법 시행 후 절대 해서는 안 되는 것은?',
opts:['삽입 부위에 압력 가하기','마사지','솜으로 덮기','일반적 관찰','체위 유지'],
ans:[1],
exp:'Z-Track 기법 후 마사지는 절대 금지입니다. 마사지하면 Z자로 어긋난 경로가 펴지면서 약물이 피하조직으로 새어나옵니다.'},
{id:18,week:9,diff:1,type:'single',
q:'근육주사 부위 중 현대 간호학에서 가장 권장하는 부위는?',
opts:['둔부 배면(Dorsogluteal)','둔부 복면(Ventrogluteal)','외측광근(Vastus lateralis)','삼각근(Deltoid)','대퇴직근(Rectus femoris)'],
ans:[1],
exp:'둔부 복면(Ventrogluteal): 신경·혈관 없음, 지방 적음, 분변 오염 적음. 현대 간호학에서 가장 권장하는 IM 부위입니다.'},
{id:19,week:9,diff:1,type:'single',
q:'인슐린 주사 부위 중 흡수 속도가 가장 빠른 곳은?',
opts:['둔부','대퇴부','상완부','복부','전완부'],
ans:[3],
exp:'인슐린 흡수 속도: 복부 > 상완부 > 대퇴부 > 둔부. 일정한 혈당 조절을 위해 복부 주사를 권장합니다.'},
{id:20,week:9,diff:1,type:'single',
q:'헤파린 피하주사 시 주의사항으로 옳지 않은 것은?',
opts:['배꼽에서 5cm 이내 피함','내관을 당겨 흡인 금지','주사 후 마사지 금지','주사기 내 0.1cc 공기 포함','같은 부위 반복 주사 금지'],
ans:[2],
exp:'헤파린 주사 후 마사지는 절대 금지입니다. 마사지하면 혈종 및 출혈 위험이 증가합니다.'},
{id:21,week:9,diff:2,type:'single',
q:'항생제 피부반응 검사(AST) 양성 판정 기준은?',

// ─── QUIZ STATE ───────────────────────────────────────────────────────────────
let state = {
  started: false,
  finished: false,
  current: null,
  difficulty: 1,
  answered: false,
  streakCorrect: 0,
  streakWrong: 0,
  used: new Set(),
  totalAnswered: 0,
  totalCorrect: 0,
  diffStats: {1:{correct:0,total:0},2:{correct:0,total:0},3:{correct:0,total:0}},
  selectedOpts: new Set(),
  shortVal: '',
  wrongQuestions: [],
  shuffleMap: null,
  mode: 'adaptive', // 'adaptive' | 'full'
};
const TOTAL = 40; // 적응형 모드 문제 수

function getTotal(){ return state.mode === 'full' ? QUESTIONS.length : TOTAL; }
const STREAK_UP = 3;
const STREAK_DOWN = 2;

function diffLabel(d){return d===1?'기본':d===2?'중급':'고급'}
function diffClass(d){return d===1?'diff-1':d===2?'diff-2':'diff-3'}
function typeLabel(t){return t==='single'?'단일정답':t==='multi'?'복수정답':'주관식'}

function shuffleIndices(n){
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getPool(diff){
  return QUESTIONS.filter(q=>q.diff===diff && !state.used.has(q.id));
}

function pickQuestion(){
  if(state.mode === 'full'){
    const allLeft = QUESTIONS.filter(q=>!state.used.has(q.id));
    if(allLeft.length===0) return null;
    return allLeft[Math.floor(Math.random()*allLeft.length)];
  }
  let pool = getPool(state.difficulty);
  if(pool.length===0){
    // 현재 난이도 소진 → 인접 난이도로 확장
    const allLeft = QUESTIONS.filter(q=>!state.used.has(q.id));
    if(allLeft.length===0) return null;
    const diffs = [state.difficulty-1, state.difficulty+1, 1, 2, 3];
    for(const d of diffs){
      pool = allLeft.filter(q=>q.diff===d);
      if(pool.length>0) break;
    }
  }
  if(pool.length===0) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function checkAnswer(){
  const q = state.current;
  if(q.type==='short'){
    const val = state.shortVal.trim().toLowerCase();
    return q.keys.some(k=>val.includes(k.toLowerCase()));
  }
  // display position → original index via shuffleMap
  const selOrig = [...state.selectedOpts].map(di=>state.shuffleMap[di]).sort((a,b)=>a-b);
  const ans = [...q.ans].sort((a,b)=>a-b);
  return selOrig.length===ans.length && selOrig.every((v,i)=>v===ans[i]);
}

function nextQuestion(){
  const q = pickQuestion();
  if(!q || state.totalAnswered >= getTotal()){
    state.finished = true;
    render();
    return;
  }
  state.current = q;
  state.used.add(q.id);
  state.answered = false;
  state.selectedOpts = new Set();
  state.shortVal = '';
  state.shuffleMap = q.type==='short' ? null : shuffleIndices(q.opts.length);
  render();
}

function submitAnswer(){
  if(!state.answered){
    state.answered = true;
    const correct = checkAnswer();
    state.totalAnswered++;
    state.diffStats[state.difficulty].total++;
    if(correct){
      state.totalCorrect++;
      state.diffStats[state.difficulty].correct++;
      state.streakCorrect++;
      state.streakWrong=0;
      if(state.streakCorrect>=STREAK_UP && state.difficulty<3){
        state.difficulty++;
        state.streakCorrect=0;
      }
    } else {
      state.wrongQuestions.push(state.current);
      state.streakWrong++;
      state.streakCorrect=0;
      if(state.streakWrong>=STREAK_DOWN && state.difficulty>1){
        state.difficulty--;
        state.streakWrong=0;
      }
    }
    render();
  }
}

  const app = document.getElementById('app');
  if(!state.started){ app.innerHTML = renderStart(); bindStart(); return; }
  if(state.finished){ app.innerHTML = renderResult(); bindRestart(); return; }
  app.innerHTML = renderQuiz();
  bindQuiz();
}

  return `
<div class="header"><h1>기본간호학1 퀴즈${state.mode==='full'?' · 전체 풀기':''}</h1></div>
<div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
<div class="progress-meta"><span>${state.totalAnswered} / ${total} 문제</span><span>정답률 ${state.totalAnswered>0?Math.round(state.totalCorrect/state.totalAnswered*100):0}%</span></div>
<div class="diff-row">
  <span class="diff-badge ${diffClass(state.difficulty)}">${diffLabel(state.difficulty)}</span>
  <span class="week-badge">${q.week}주차</span>
  <span class="type-badge">${typeLabel(q.type)}</span>
  ${state.streakCorrect>0?`<span class="streak-badge">${streakIcon}</span>`:''}
</div>
<div class="card">
  <div class="q-num">Q${state.totalAnswered+1}</div>
  <div class="q-text">${esc(q.q)}</div>
  ${hintHtml}${shortHint}
  ${optHtml}
  ${feedbackHtml}
  <div class="btn-row">
    ${!state.answered?`<button class="btn btn-primary" id="submitBtn" ${submitDisabled?'disabled':''}>확인</button>`:''}
    ${state.answered?`<button class="btn btn-next" id="nextBtn">${state.totalAnswered>=total?'결과 보기':'다음 문제 →'}</button>`:''}
  </div>
</div>`;
}

function renderResult(){
  const pct = Math.round(state.totalCorrect/state.totalAnswered*100);
  let grade='', msg='';
  if(pct>=90){grade='S';msg='완벽합니다! 기본간호학1 마스터 수준이에요. 시험 걱정 없습니다 💪';}
  else if(pct>=80){grade='A';msg='훌륭해요! 핵심 내용을 잘 이해하고 있습니다. 틀린 문제만 복습하세요.';}
  else if(pct>=70){grade='B';msg='잘 했습니다! 조금 더 복습하면 완벽해질 거예요.';}
  else if(pct>=60){grade='C';msg='기본기를 다시 다져봅시다. 오답 노트를 활용해 보세요.';}
  else{grade='D';msg='포기하지 마세요! Wiki 노트를 다시 읽고 재도전해보세요.';}

  const ds = state.diffStats;
  const maxDiff = state.used.size>0 ? Math.max(...[...state.used].map(id=>QUESTIONS.find(q=>q.id===id).diff)) : 1;

  return `
<div class="header"><h1>기본간호학1 퀴즈</h1></div>
<div class="card result">
  <div style="font-size:1rem;color:#94a3b8">최종 결과</div>
  <div class="result-score">${pct}%</div>
  <div class="result-label">${state.totalCorrect} / ${state.totalAnswered} 정답 · 등급 <strong style="color:#c7d2fe">${grade}</strong></div>
  <div class="result-msg">${msg}</div>
  <div class="result-grid">
    <div class="result-cell"><div class="result-cell-n">${state.totalCorrect}</div><div class="result-cell-l">정답</div></div>
    <div class="result-cell"><div class="result-cell-n">${state.totalAnswered-state.totalCorrect}</div><div class="result-cell-l">오답</div></div>
    <div class="result-cell"><div class="result-cell-n">${diffLabel(maxDiff)}</div><div class="result-cell-l">최고 난이도</div></div>
  </div>
  <div class="diff-summary">
    ${[1,2,3].map(d=>{
      const s=ds[d];
      const p=s.total>0?Math.round(s.correct/s.total*100):0;
      return s.total>0?`<div class="diff-summary-row">
        <span class="diff-badge ${diffClass(d)}">${diffLabel(d)}</span>
        <span>${s.correct}/${s.total} 정답 (${p}%)</span>
      </div>`:''}).join('')}
  </div>
  ${state.wrongQuestions.length>0?`<div style="text-align:left;margin-bottom:20px">
    <div style="font-size:.85rem;color:#94a3b8;margin-bottom:10px">📌 틀린 주차별 분포</div>
    ${[...new Set(state.wrongQuestions.map(q=>q.week))].sort().map(w=>{
      const cnt=state.wrongQuestions.filter(q=>q.week===w).length;
      return `<div style="display:flex;justify-content:space-between;padding:8px 14px;background:#0f172a;border-radius:8px;margin-bottom:6px;font-size:.85rem">
        <span style="color:#94a3b8">${w}주차</span><span style="color:#f472b6">${cnt}문제 틀림</span></div>`;}).join('')}
  </div>`:''}
  <button class="btn-restart" id="restartBtn">다시 풀기</button>
</div>`;
}

// ─── BINDING ──────────────────────────────────────────────────────────────────
function esc(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function bindStart(){
  document.getElementById('tabAdaptive').onclick=()=>{state.mode='adaptive';render();};
  document.getElementById('tabFull').onclick=()=>{state.mode='full';render();};
  document.getElementById('startBtn').onclick=()=>{
    state.started=true;
    nextQuestion();
  };
}

function bindQuiz(){
  const q=state.current;
  if(q.type==='short'){
    const inp=document.getElementById('shortInput');
    if(inp){
      inp.addEventListener('input',e=>{
        state.shortVal=e.target.value;
        const sb=document.getElementById('submitBtn');
        if(sb) sb.disabled=state.shortVal.trim()==='';
      });
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!state.answered&&state.shortVal.trim()!=='') submitAnswer();});
    }
  } else {
    document.querySelectorAll('input[name="opt"]').forEach(inp=>{
      inp.addEventListener('change',e=>{
        const idx=parseInt(e.target.dataset.idx);
        if(q.type==='single'){
          state.selectedOpts=new Set([idx]);
          document.querySelectorAll('.option').forEach((el,i)=>{
            el.classList.toggle('selected',i===idx);
          });
        } else {
          if(e.target.checked) state.selectedOpts.add(idx);
          else state.selectedOpts.delete(idx);
          e.target.closest('.option').classList.toggle('selected',e.target.checked);
        }
        const sb=document.getElementById('submitBtn');
        if(sb) sb.disabled=state.selectedOpts.size===0;
      });
    });
  }
  const sb=document.getElementById('submitBtn');
  if(sb) sb.onclick=submitAnswer;
  const nb=document.getElementById('nextBtn');
  if(nb) nb.onclick=()=>{
    if(state.totalAnswered>=getTotal()){state.finished=true;render();}
    else nextQuestion();
  };
}

function bindRestart(){
  document.getElementById('restartBtn').onclick=()=>{
    const savedMode = state.mode;
    state={started:false,finished:false,current:null,difficulty:1,answered:false,
      streakCorrect:0,streakWrong:0,used:new Set(),totalAnswered:0,totalCorrect:0,
      diffStats:{1:{correct:0,total:0},2:{correct:0,total:0},3:{correct:0,total:0}},
      selectedOpts:new Set(),shortVal:'',wrongQuestions:[],shuffleMap:null,mode:savedMode};
    render();
  };
}

render();
</script>
</body>
</html>
